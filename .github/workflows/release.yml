name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build:packages

      - name: Build Linux packages
        run: npm run dist -w apps/electron-app

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-artifacts
          path: |
            apps/electron-app/release/*.AppImage
            apps/electron-app/release/*.deb
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build:packages

      - name: Build Windows packages
        run: npm run dist -w apps/electron-app

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-artifacts
          path: |
            apps/electron-app/release/*.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts

      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"
          release_notes="docs/releases/release-${version}.md"

          if [ "${tag}" = "${version}" ]; then
            echo "Tag must use the vX.Y.Z format." >&2
            exit 1
          fi

          if [ "${package_version}" != "${version}" ]; then
            echo "Tag version ${version} does not match package.json ${package_version}." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tag ${tag} must point to a commit reachable from origin/main." >&2
            exit 1
          fi

          if [ ! -f "${release_notes}" ]; then
            echo "Missing release notes file: ${release_notes}" >&2
            exit 1
          fi

          release_title="$(head -n 1 "${release_notes}" | sed 's/^# *//')"
          if [ -z "${release_title}" ]; then
            echo "Release notes must start with a level-one Markdown title." >&2
            exit 1
          fi

          release_body="$(mktemp)"
          tail -n +2 "${release_notes}" | sed '1{/^$/d;}' > "${release_body}"

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_notes=${release_notes}" >> "${GITHUB_OUTPUT}"
          echo "release_title=${release_title}" >> "${GITHUB_OUTPUT}"
          echo "release_body=${release_body}" >> "${GITHUB_OUTPUT}"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY: ${{ steps.metadata.outputs.release_body }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.release_title }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          mapfile -t release_files < <(find release-artifacts -type f | sort)

          if [ "${#release_files[@]}" -eq 0 ]; then
            echo "No release artifacts found." >&2
            exit 1
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" --title "${RELEASE_TITLE}" --notes-file "${RELEASE_BODY}"
            gh release upload "${tag}" "${release_files[@]}" --clobber
            exit 0
          fi

          gh release create "${tag}" "${release_files[@]}" \
            --title "${RELEASE_TITLE}" \
            --notes-file "${RELEASE_BODY}"
