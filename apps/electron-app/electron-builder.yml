appId: io.opencodexui.app
productName: OpenCodexUI

directories:
  buildResources: build
  output: release

afterPack: scripts/after-pack.cjs

files:
  - dist/**/*
  - package.json
  - "!node_modules/onnxruntime-node/**/libonnxruntime_providers_cuda*"
  - "!node_modules/onnxruntime-node/**/libonnxruntime_providers_tensorrt*"

extraResources:
  - from: build/debug-adapter/1.140.0/js-debug
    to: debug-adapter/js-debug
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
  - from: ../../prompt-commit.default.md
    to: prompt-commit.default.md
  - from: ../../prompt-commit.generation.md
    to: prompt-commit.generation.md

asarUnpack:
  - "**/node_modules/onnxruntime-node/**/*"
  - "**/node_modules/@img/**/*"
  - "**/node_modules/better-sqlite3/**/*"

publish:
  # Generate updater metadata; the release workflow performs the upload itself.
  provider: github
  owner: akerfourn
  repo: OpenCodexUI

linux:
  icon: build/icon.png
  executableName: open-codex-ui
  target:
    - AppImage
    - deb
  category: Development
  maintainer: Adrien Kerfourn <ak.sitecontact@gmail.com>

deb:
  packageName: open-codex-ui
  artifactName: open-codex-ui_${version}_${arch}.${ext}

mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Record audio for voice dictation in your message drafts.
  icon: build/icon.icns
  target:
    - dmg
  category: public.app-category.developer-tools

win:
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - nsis
    - portable

nsis:
  artifactName: OpenCodexUI Setup ${version}.${ext}

portable:
  artifactName: OpenCodexUI Portable ${version}.${ext}
